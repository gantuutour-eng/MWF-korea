<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dbeafe"/>
      <stop offset="1" stop-color="#bfdbfe"/>
    </linearGradient>
  </defs>
  <rect width="600" height="340" fill="url(#bg)"/>
  <!-- City silhouette -->
  <g fill="#60a5fa" opacity="0.5">
    <rect x="40" y="180" width="40" height="100"/>
    <rect x="90" y="160" width="50" height="120"/>
    <rect x="150" y="200" width="35" height="80"/>
    <polygon points="100,160 115,140 130,160"/>
    <rect x="113" y="80" width="4" height="60"/>
  </g>
  <g fill="#3b82f6" opacity="0.55">
    <rect x="200" y="190" width="45" height="90"/>
    <rect x="255" y="175" width="55" height="105"/>
    <rect x="320" y="200" width="40" height="80"/>
    <rect x="370" y="170" width="50" height="110"/>
  </g>
  <!-- Ground -->
  <rect y="270" width="600" height="70" fill="#3b82f6" opacity="0.18"/>
  <!-- Passport stack -->
  <g transform="translate(380 110)">
    <rect x="20" y="20" width="150" height="200" rx="8" fill="#fff" stroke="#dbeafe" stroke-width="2"/>
    <text x="95" y="50" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="700" fill="#1e3a8a" text-anchor="middle">сайн ажилтны үнэмлэх</text>
    <line x1="35" y1="80" x2="155" y2="80" stroke="#cbd5e1"/>
    <line x1="35" y1="100" x2="155" y2="100" stroke="#cbd5e1"/>
    <line x1="35" y1="120" x2="120" y2="120" stroke="#cbd5e1"/>
    <line x1="35" y1="140" x2="155" y2="140" stroke="#cbd5e1"/>
    <line x1="35" y1="160" x2="120" y2="160" stroke="#cbd5e1"/>
    <rect x="40" y="180" width="60" height="30" rx="2" fill="#1e3a8a" opacity="0.15"/>
  </g>
  <g transform="translate(460 130)">
    <rect width="110" height="150" rx="8" fill="#1e3a8a"/>
    <circle cx="55" cy="60" r="22" fill="none" stroke="#fbbf24" stroke-width="2"/>
    <text x="55" y="66" font-family="Plus Jakarta Sans, sans-serif" font-size="20" font-weight="700" fill="#fbbf24" text-anchor="middle">대한</text>
    <text x="55" y="100" font-family="Plus Jakarta Sans, sans-serif" font-size="10" font-weight="700" fill="#fbbf24" text-anchor="middle">민국</text>
    <text x="55" y="125" font-family="Plus Jakarta Sans, sans-serif" font-size="7" font-weight="500" fill="#fbbf24" text-anchor="middle">REPUBLIC OF KOREA</text>
  </g>
  <!-- Plant -->
  <g transform="translate(540 230)">
    <ellipse cx="20" cy="80" rx="20" ry="10" fill="#16a34a" opacity="0.3"/>
    <rect x="10" y="60" width="20" height="25" rx="3" fill="#92400e"/>
    <path d="M20 60 Q5 30 15 10 Q25 30 20 60" fill="#22c55e"/>
    <path d="M20 60 Q35 30 25 5 Q15 30 20 60" fill="#16a34a"/>
  </g>
</svg>
