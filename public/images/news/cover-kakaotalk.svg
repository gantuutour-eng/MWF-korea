<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="kbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef9c3"/>
      <stop offset="1" stop-color="#fde047"/>
    </linearGradient>
  </defs>
  <rect width="600" height="340" fill="url(#kbg)"/>
  <!-- Phone with TALK bubble -->
  <g transform="translate(220 50)">
    <rect width="160" height="260" rx="22" fill="#1f2937"/>
    <rect x="6" y="6" width="148" height="248" rx="18" fill="#fde047"/>
    <rect x="60" y="14" width="40" height="6" rx="3" fill="#1f2937"/>
    <!-- Speech bubble in screen -->
    <g transform="translate(28 60)">
      <rect width="104" height="80" rx="20" fill="#fbbf24"/>
      <path d="M30 80 L24 100 L48 80 Z" fill="#fbbf24"/>
      <text x="52" y="50" font-family="Plus Jakarta Sans, sans-serif" font-size="22" font-weight="800" fill="#1f2937" text-anchor="middle">TALK</text>
    </g>
    <circle cx="80" cy="225" r="8" fill="#1f2937" opacity="0.5"/>
  </g>
  <!-- Background speech bubbles -->
  <g transform="translate(70 130)" opacity="0.85">
    <rect width="120" height="80" rx="20" fill="#fff"/>
    <path d="M100 80 L106 100 L82 80 Z" fill="#fff"/>
    <circle cx="40" cy="40" r="4" fill="#9ca3af"/>
    <circle cx="60" cy="40" r="4" fill="#9ca3af"/>
    <circle cx="80" cy="40" r="4" fill="#9ca3af"/>
  </g>
  <!-- Plant pot bottom-right -->
  <g transform="translate(430 180)">
    <ellipse cx="60" cy="140" rx="50" ry="12" fill="#16a34a" opacity="0.25"/>
    <rect x="30" y="100" width="60" height="50" rx="6" fill="#fff"/>
    <line x1="38" y1="115" x2="82" y2="115" stroke="#22c55e" stroke-width="2"/>
    <path d="M60 100 Q30 60 50 20 Q70 60 60 100" fill="#16a34a"/>
    <path d="M60 100 Q90 60 70 10 Q50 60 60 100" fill="#22c55e"/>
    <path d="M60 100 Q40 50 30 30" stroke="#16a34a" stroke-width="3" fill="none"/>
  </g>
  <!-- Stars/sparkles -->
  <g fill="#fff" opacity="0.7">
    <circle cx="80" cy="60" r="3"/>
    <circle cx="510" cy="80" r="4"/>
    <circle cx="120" cy="280" r="3"/>
    <circle cx="540" cy="50" r="3"/>
  </g>
</svg>
