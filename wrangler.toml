name = "mwf-korea"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "./dist"

# D1 database (created via `wrangler d1 create mwa-korea-db`)
[[d1_databases]]
binding = "DB"
database_name = "mwa-korea-db"
database_id = "fe928fb9-9c1c-41a1-a368-b9bb009cd306"

# KV namespace (created via `wrangler kv namespace create SESSIONS`)
[[kv_namespaces]]
binding = "SESSIONS"
id = "5133df5b7b0e48808c59e2ef10245837"

# R2 bucket (created via `wrangler r2 bucket create mwa-korea-media`)
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "mwa-korea-media"

[vars]
SESSION_COOKIE_NAME = "mwa_session"
